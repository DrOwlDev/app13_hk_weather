name: Update HKO Temperature Pages

on:
  push:
    branches: [main]
  schedule:
    # UTC time. Stagger off the hour to reduce GitHub queue delays.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [refresh-hko]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest HKO data
        run: |
          python scripts/fetch_hko_ocf.py
          python -c "import json; d=json.load(open('docs/data.json')); print('Deployed fetchedAt:', d['fetchedAt'])"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
